services:
  catalog:
    build:
      context: .
      dockerfile: catalog/Dockerfile
    environment:
      CATALOG_DB_PATH: /data/catalog.db
    volumes:
      - catalog_data:/data

  order:
    build:
      context: .
      dockerfile: order/Dockerfile
    environment:
      CATALOG_URL: http://catalog:5001
      ORDER_DB_PATH: /data/orders.db
    volumes:
      - order_data:/data
    depends_on:
      - catalog

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      CATALOG_URL: http://catalog:5001
      ORDER_URL: http://order:5002
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      - catalog
      - order

volumes:
  catalog_data:
  order_data: